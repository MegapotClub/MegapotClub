<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Club live read-only traffic inspection</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <details
      open
      style="
        padding: 8px;
        background: #ffe8a6;
        color: #171717;
        font: 12px monospace;
      "
    >
      <summary>Live public reads · no signing</summary>
      <output id="traffic"></output>
    </details>
    <div id="root"></div>
    <script type="module">
      const fetchActual = window.fetch.bind(window),
        started = Date.now(),
        calls = [];
      const render = () =>
        (document.querySelector("#traffic").textContent = JSON.stringify(
          { elapsedSeconds: Math.floor((Date.now() - started) / 1000), calls },
          null,
          2,
        ));
      window.fetch = async (input, init) => {
        const url = new URL(
            typeof input === "string" ? input : input.url,
            location.href,
          ),
          external = url.origin !== location.origin;
        if (!external) return fetchActual(input, init);
        let body;
        try {
          body = JSON.parse(init?.body);
        } catch {}
        const call = {
          second: Math.floor((Date.now() - started) / 1000),
          host: url.host,
          apiPath:
            url.host === "api.megapot.io"
              ? url.pathname + url.search
              : undefined,
          method: body?.method ?? "GET",
          multicall:
            body?.method === "eth_call" &&
            String(body.params?.[0]?.to).toLowerCase() ===
              "0xca11bde05977b3631167028862be2a173976ca11",
          status: "pending",
        };
        calls.push(call);
        render();
        try {
          const response = await fetchActual(input, init);
          call.status = response.status;
          return response;
        } catch (e) {
          call.status = "network-error";
          throw e;
        } finally {
          render();
        }
      };
      setInterval(render, 1000);
      await import("/src/main.tsx");
    </script>
  </body>
</html>
